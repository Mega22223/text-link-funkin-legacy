<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text → Link</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#4173e6;
    --ok:#3ecf7a; --bad:#ff6b6b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:640px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  h1{font-size:20px; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 20px;}
  textarea{
    width:100%; min-height:200px; resize:vertical; background:#0d0f14; color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:12px; font-size:14px;
    font-family:inherit; line-height:1.5;
  }
  textarea:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; margin-top:14px;
  }
  button:hover{background:var(--accent2);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button.secondary{background:#2a2f3a;}
  button.secondary:hover{background:#343a48;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .stats{margin-top:10px; font-size:12px; color:var(--muted);}
  .link-box{margin-top:16px; display:none; gap:8px;}
  .link-box input{
    flex:1; background:#0d0f14; color:var(--accent); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; font-size:13px; font-family:monospace;
  }
  .hint{font-size:12px; color:var(--muted); margin-top:8px;}
  .out{
    white-space:pre-wrap; word-break:break-word; background:#0d0f14; border:1px solid var(--border);
    border-radius:8px; padding:14px; font-size:14px; line-height:1.6; max-height:60vh; overflow:auto;
  }
  .badge{display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--border);
    border-radius:6px; padding:2px 8px; margin-bottom:10px;}
  .err{color:var(--bad); font-size:14px;}
  .spin{color:var(--muted); font-size:14px;}
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
// ==== ЗАПОЛНИ СВОИМИ ЗНАЧЕНИЯМИ ИЗ Project Settings -> API ====
const SUPABASE_URL = "https://ВАШ-ПРОЕКТ.supabase.co";
const SUPABASE_ANON_KEY = "ВАШ-ANON-PUBLIC-КЛЮЧ";
// ===============================================================

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ID_LEN = 8;
const ID_CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

function generateId(len = ID_LEN) {
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = "";
  for (let i = 0; i < len; i++) out += ID_CHARS[arr[i] % ID_CHARS.length];
  return out;
}

async function saveText(text, attempt = 0) {
  const id = generateId();
  const { error } = await supabaseClient.from("snippets").insert({ id, content: text });
  if (error) {
    if (error.code === "23505" && attempt < 5) return saveText(text, attempt + 1); // коллизия id — редко, повторяем
    throw error;
  }
  return id;
}

async function loadText(id) {
  const { data, error } = await supabaseClient
    .from("snippets")
    .select("content")
    .eq("id", id)
    .single();
  if (error) throw error;
  return data.content;
}

const app = document.getElementById("app");

function getHashId() {
  const h = location.hash;
  if (h.startsWith("#s=")) return h.slice(3);
  return null;
}

function renderLoading() {
  app.innerHTML = `<p class="spin">Загрузка...</p>`;
}

function renderViewer(text) {
  app.innerHTML = `
    <span class="badge">Текст из ссылки</span>
    <div class="out" id="out"></div>
    <div class="row">
      <button id="copyBtn">Скопировать текст</button>
      <button class="secondary" id="newBtn">Создать новую ссылку</button>
    </div>
    <p class="hint">Текст хранится в базе Supabase, в ссылке — только короткий идентификатор.</p>
  `;
  document.getElementById("out").textContent = text;
  document.getElementById("copyBtn").onclick = () => {
    navigator.clipboard.writeText(text).then(() => {
      const b = document.getElementById("copyBtn");
      const old = b.textContent; b.textContent = "Скопировано!";
      setTimeout(() => b.textContent = old, 1200);
    });
  };
  document.getElementById("newBtn").onclick = () => { location.hash = ""; renderEditor(); };
}

function renderError(msg) {
  app.innerHTML = `
    <h1>Не удалось загрузить текст</h1>
    <p class="err">${msg || "Запись не найдена — возможно, ссылка неверна или запись удалена."}</p>
    <button id="newBtn">Создать новую ссылку</button>
  `;
  document.getElementById("newBtn").onclick = () => { location.hash = ""; renderEditor(); };
}

function renderEditor() {
  app.innerHTML = `
    <h1>Текст → Ссылка</h1>
    <p class="sub">Текст сохраняется в базе данных, а в ссылке остаётся только короткий идентификатор — ссылка получается минимальной длины независимо от размера текста.</p>
    <textarea id="input" placeholder="Введите текст..."></textarea>
    <div class="stats">Символов: <b id="statChars">0</b></div>
    <div class="row">
      <button id="genBtn">Создать ссылку</button>
    </div>
    <div class="link-box row" id="linkBox">
      <input type="text" id="linkOut" readonly>
      <button class="secondary" id="copyLinkBtn">Копировать</button>
    </div>
    <p class="hint err" id="genErr"></p>
  `;

  const input = document.getElementById("input");
  const statChars = document.getElementById("statChars");
  const genBtn = document.getElementById("genBtn");
  const genErr = document.getElementById("genErr");

  input.addEventListener("input", () => {
    statChars.textContent = input.value.length;
  });

  genBtn.onclick = async () => {
    const val = input.value;
    if (!val.trim()) return;
    genBtn.disabled = true;
    genErr.textContent = "";
    try {
      const id = await saveText(val);
      const url = location.origin + location.pathname + "#s=" + id;
      const box = document.getElementById("linkBox");
      box.style.display = "flex";
      document.getElementById("linkOut").value = url;
    } catch (e) {
      genErr.textContent = "Ошибка сохранения: " + e.message + " (проверь SUPABASE_URL / ANON_KEY и политики RLS)";
    } finally {
      genBtn.disabled = false;
    }
  };

  document.getElementById("copyLinkBtn").onclick = () => {
    const el = document.getElementById("linkOut");
    el.select();
    navigator.clipboard.writeText(el.value).then(() => {
      const b = document.getElementById("copyLinkBtn");
      const old = b.textContent; b.textContent = "Готово!";
      setTimeout(() => b.textContent = old, 1200);
    });
  };
}

async function boot() {
  const id = getHashId();
  if (!id) { renderEditor(); return; }
  renderLoading();
  try {
    const text = await loadText(id);
    renderViewer(text);
  } catch (e) {
    renderError();
  }
}

window.addEventListener("hashchange", boot);
boot();
</script>
</body>
</html>
