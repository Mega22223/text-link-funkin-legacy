<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text → Link</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#4173e6;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:640px; background:var(--panel); border:1px solid var(--border);
    border-radius:14px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,.3);
  }
  h1{font-size:20px; margin:0 0 4px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 20px;}
  textarea{
    width:100%; min-height:160px; resize:vertical; background:#0d0f14; color:var(--text);
    border:1px solid var(--border); border-radius:8px; padding:12px; font-size:14px;
    font-family:inherit; line-height:1.5;
  }
  textarea:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; margin-top:14px;
  }
  button:hover{background:var(--accent2);}
  button.secondary{background:#2a2f3a;}
  button.secondary:hover{background:#343a48;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .link-box{
    margin-top:16px; display:none; gap:8px;
  }
  .link-box input{
    flex:1; background:#0d0f14; color:var(--accent); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; font-size:13px; font-family:monospace;
  }
  .hint{font-size:12px; color:var(--muted); margin-top:8px;}
  .readonly-note{font-size:12px; color:var(--muted); margin-top:16px;}
  .out{
    white-space:pre-wrap; word-break:break-word; background:#0d0f14; border:1px solid var(--border);
    border-radius:8px; padding:14px; font-size:14px; line-height:1.6; max-height:60vh; overflow:auto;
  }
  .badge{display:inline-block; font-size:11px; color:var(--muted); border:1px solid var(--border);
    border-radius:6px; padding:2px 8px; margin-bottom:10px;}
  .err{color:#ff6b6b; font-size:14px;}
</style>
</head>
<body>
<div class="card" id="app"></div>

<script>
const LZ = LZString;
const app = document.getElementById('app');

function getHashData() {
  const h = location.hash;
  if (h.startsWith('#d=')) return decodeURIComponent(h.slice(3));
  return null;
}

function renderViewer(text) {
  app.innerHTML = `
    <span class="badge">Текст из ссылки</span>
    <div class="out" id="out"></div>
    <div class="row">
      <button id="copyBtn">Скопировать текст</button>
      <button class="secondary" id="newBtn">Создать новую ссылку</button>
    </div>
    <p class="hint">Текст полностью закодирован в самой ссылке (после #), сервер и база данных не нужны.</p>
  `;
  document.getElementById('out').textContent = text;
  document.getElementById('copyBtn').onclick = () => {
    navigator.clipboard.writeText(text).then(() => {
      const b = document.getElementById('copyBtn');
      const old = b.textContent; b.textContent = 'Скопировано!';
      setTimeout(() => b.textContent = old, 1200);
    });
  };
  document.getElementById('newBtn').onclick = () => {
    location.hash = '';
    renderEditor();
  };
}

function renderError() {
  app.innerHTML = `
    <h1>Не удалось прочитать текст</h1>
    <p class="err">Ссылка повреждена или неполная.</p>
    <button id="newBtn">Создать новую ссылку</button>
  `;
  document.getElementById('newBtn').onclick = () => { location.hash=''; renderEditor(); };
}

function renderEditor() {
  app.innerHTML = `
    <h1>Текст → Ссылка</h1>
    <p class="sub">Введите текст. Он будет закодирован прямо в ссылке — открыв её, любой человек (или программа через обычный HTTP-запрос) увидит этот текст. Ничего не хранится на сервере.</p>
    <textarea id="input" placeholder="Введите текст..."></textarea>
    <div class="row">
      <button id="genBtn">Создать ссылку</button>
    </div>
    <div class="link-box row" id="linkBox">
      <input type="text" id="linkOut" readonly>
      <button class="secondary" id="copyLinkBtn">Копировать</button>
    </div>
    <p class="readonly-note">Совет: чем длиннее текст, тем длиннее получится ссылка (она сжимается, но лимиты браузеров/мессенджеров на длину URL всё равно есть).</p>
  `;
  document.getElementById('genBtn').onclick = () => {
    const val = document.getElementById('input').value;
    if (!val.trim()) return;
    const compressed = LZ.compressToEncodedURIComponent(val);
    const url = location.origin + location.pathname + '#d=' + compressed;
    const box = document.getElementById('linkBox');
    box.style.display = 'flex';
    document.getElementById('linkOut').value = url;
  };
  document.getElementById('copyLinkBtn') && (document.getElementById('copyLinkBtn').onclick = () => {
    const el = document.getElementById('linkOut');
    el.select();
    navigator.clipboard.writeText(el.value).then(() => {
      const b = document.getElementById('copyLinkBtn');
      const old = b.textContent; b.textContent = 'Готово!';
      setTimeout(() => b.textContent = old, 1200);
    });
  });
}

function boot() {
  const encoded = getHashData();
  if (encoded === null) { renderEditor(); return; }
  try {
    const text = LZ.decompressFromEncodedURIComponent(encoded);
    if (text === null || text === '') { renderError(); return; }
    renderViewer(text);
  } catch (e) {
    renderError();
  }
}

window.addEventListener('hashchange', boot);
boot();
</script>
</body>
</html>
