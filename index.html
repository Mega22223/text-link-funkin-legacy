<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text to link</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#5b8cff; --accent2:#4173e6;
    --bad:#ff6b6b;
  }
  *{box-sizing:border-box; border-radius:0 !important;}
  html, body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  /* ---- editor (form) view ---- */
  #app{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .card{
    width:100%; max-width:520px; background:var(--panel); border:1px solid var(--border);
    padding:28px;
  }
  h1{font-size:20px; margin:0 0 4px; letter-spacing:.2px;}
  p.sub{color:var(--muted); font-size:13px; margin:0 0 20px; line-height:1.5;}
  textarea{
    width:100%; min-height:200px; resize:vertical; background:#0d0f14; color:var(--text);
    border:1px solid var(--border); padding:12px; font-size:14px;
    font-family:inherit; line-height:1.5;
  }
  textarea:focus, input:focus{outline:2px solid var(--accent); outline-offset:1px;}
  button{
    background:var(--accent); color:#fff; border:none;
    padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; margin-top:14px;
  }
  button:hover{background:var(--accent2);}
  button:disabled{opacity:.5; cursor:not-allowed;}
  button.secondary{background:#2a2f3a;}
  button.secondary:hover{background:#343a48;}
  .row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .stats{margin-top:10px; font-size:12px; color:var(--muted);}
  .link-box{margin-top:16px; display:none; gap:8px;}
  .link-box input{
    flex:1; background:#0d0f14; color:var(--accent); border:1px solid var(--border);
    padding:10px 12px; font-size:13px; font-family:monospace;
  }
  .hint{font-size:12px; color:var(--muted); margin-top:8px;}
  .err{color:var(--bad); font-size:12px; margin-top:8px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
// ==== Supabase project credentials ====
const SUPABASE_URL = "https://bfdzbjhtjstxfxfqfcit.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_i2uuK7F-iC1RdX6XQ5uUWw_zVdPK3aO";
// =======================================

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const ID_LEN = 8;
const ID_CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

function generateId(len = ID_LEN) {
  const arr = new Uint32Array(len);
  crypto.getRandomValues(arr);
  let out = "";
  for (let i = 0; i < len; i++) out += ID_CHARS[arr[i] % ID_CHARS.length];
  return out;
}

async function saveText(text, attempt = 0) {
  const id = generateId();
  const { error } = await supabaseClient.from("snippets").insert({ id, content: text });
  if (error) {
    if (error.code === "23505" && attempt < 5) return saveText(text, attempt + 1); // id collision, retry
    throw error;
  }
  return id;
}

const app = document.getElementById("app");

function buildApiLink(id) {
  // Direct Supabase REST endpoint. Any plain HTTP GET (browser, curl, Roblox HttpService, etc.)
  // returns raw JSON with no HTML/JS involved: [{"content":"..."}]
  const params = new URLSearchParams({
    id: "eq." + id,
    select: "content",
    apikey: SUPABASE_ANON_KEY
  });
  return `${SUPABASE_URL}/rest/v1/snippets?${params.toString()}`;
}

function renderEditor() {
  document.body.classList.remove("raw");
  document.title = "Text to link";
  app.innerHTML = `
    <div class="card">
      <h1>Text to link</h1>
      <p class="sub">Paste your text below and get a link. Requesting that link returns raw JSON with your text — no HTML, no interface.</p>
      <textarea id="input" placeholder="Enter your text..."></textarea>
      <div class="stats">Characters: <b id="statChars">0</b></div>
      <div class="row">
        <button id="genBtn">Create link</button>
      </div>
      <div class="link-box row" id="linkBox">
        <input type="text" id="linkOut" readonly>
        <button class="secondary" id="copyLinkBtn">Copy</button>
      </div>
      <p class="err" id="genErr"></p>
    </div>
  `;

  const input = document.getElementById("input");
  const statChars = document.getElementById("statChars");
  const genBtn = document.getElementById("genBtn");
  const genErr = document.getElementById("genErr");

  input.addEventListener("input", () => {
    statChars.textContent = input.value.length;
  });

  genBtn.onclick = async () => {
    const val = input.value;
    if (!val.trim()) return;
    genBtn.disabled = true;
    genErr.textContent = "";
    try {
      const id = await saveText(val);
      const url = buildApiLink(id);
      const box = document.getElementById("linkBox");
      box.style.display = "flex";
      document.getElementById("linkOut").value = url;
    } catch (e) {
      genErr.textContent = "Error saving text: " + e.message;
    } finally {
      genBtn.disabled = false;
    }
  };

  document.getElementById("copyLinkBtn").onclick = () => {
    const el = document.getElementById("linkOut");
    el.select();
    navigator.clipboard.writeText(el.value).then(() => {
      const b = document.getElementById("copyLinkBtn");
      const old = b.textContent; b.textContent = "Copied!";
      setTimeout(() => b.textContent = old, 1200);
    });
  };
}

renderEditor();
</script>
</body>
</html>
