<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Linker</title>
    <style>
        /* Олдскульный плоский дизайн в серых тонах, углы строго 0px */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; /* Темный фон */
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .wrapper {
            width: 100%;
            max-width: 650px;
            background-color: #161b22; /* Серый блок */
            border: 1px solid #30363d; /* Четкая рамка */
            border-radius: 0px; /* Строго острые углы */
            padding: 25px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 16px;
            font-weight: 600;
            margin-top: 0;
            margin-bottom: 20px;
            color: #f0f6fc;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }

        /* Поле ввода текста */
        textarea {
            width: 100%;
            height: 280px;
            background-color: #0d1117; /* Более темное поле для контраста */
            color: #e6edf3;
            border: 1px solid #30363d;
            border-radius: 0px; /* Строго острые углы */
            padding: 12px;
            font-family: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, monospace;
            font-size: 13px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: #58a6ff; /* Синяя рамка при фокусе */
        }

        /* Кнопка генерации */
        .btn {
            display: block;
            width: 100%;
            background-color: #21262d; /* Серая кнопка в стиле GitHub */
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 0px; /* Строго острые углы */
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: background-color 0.1s, color 0.1s;
        }

        .btn:hover {
            background-color: #30363d;
            color: #f0f6fc;
        }

        /* Блок результата */
        .result-panel {
            display: none;
            margin-top: 25px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 0px; /* Строго острые углы */
            padding: 16px;
        }

        .result-title {
            font-size: 12px;
            font-weight: 600;
            color: #8b949e;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Поле с готовой ссылкой */
        .link-field {
            width: 100%;
            padding: 10px;
            background-color: #161b22;
            color: #58a6ff;
            border: 1px solid #30363d;
            border-radius: 0px; /* Строго острые углы */
            font-family: monospace;
            font-size: 13px;
            box-sizing: border-box;
            cursor: pointer;
        }

        .info-text {
            font-size: 11px;
            color: #8b949e;
            margin-top: 8px;
            margin-bottom: 0;
        }

        /* Индикатор режима просмотра */
        .view-mode-bar {
            display: none;
            background-color: #161b22;
            border: 1px solid #388bfd;
            color: #58a6ff;
            padding: 12px;
            border-radius: 0px; /* Строго острые углы */
            font-size: 13px;
            margin-bottom: 15px;
            text-align: center;
        }

        .view-mode-bar a {
            color: #f0f6fc;
            font-weight: 600;
            margin-left: 10px;
            text-decoration: none;
        }
        .view-mode-bar a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>Chart Linker</h2>
    
    <div id="viewMode" class="view-mode-bar">
        Viewing shared chart data. <a href="#" id="newBtn">Create New</a>
    </div>

    <textarea id="textBox" placeholder="Paste your chart data here..."></textarea>
    
    <button id="actionBtn" class="btn" onclick="generateLink()">Generate Roblox Link</button>

    <div id="resultBox" class="result-panel">
        <div class="result-title">Generated Link</div>
        <input type="text" id="linkOutput" class="link-field" readonly onclick="this.select()">
        <p class="info-text">Click inside the field to auto-select, then press Ctrl+C to copy.</p>
    </div>
</div>

<script>
    const textBox = document.getElementById('textBox');
    const actionBtn = document.getElementById('actionBtn');
    const resultBox = document.getElementById('resultBox');
    const linkOutput = document.getElementById('linkOutput');
    const viewMode = document.getElementById('viewMode');
    const newBtn = document.getElementById('newBtn');

    window.addEventListener('DOMContentLoaded', () => {
        if (window.location.hash) {
            try {
                const base64 = window.location.hash.substring(1);
                const decodedText = decodeURIComponent(atob(base64));
                
                textBox.value = decodedText;
                textBox.setAttribute('readonly', 'true');
                
                viewMode.style.display = 'block';
                actionBtn.style.display = 'none';
            } catch (e) {
                alert("Error: Couldn't decode the chart data from this URL.");
            }
        }
    });

    function generateLink() {
        const text = textBox.value.trim();
        if (!text) {
            alert("Please paste your chart data first!");
            return;
        }

        const base64 = btoa(encodeURIComponent(text));
        const finalUrl = window.location.origin + window.location.pathname + '#' + base64;
        
        linkOutput.value = finalUrl;
        resultBox.style.display = 'block';
        
        resultBox.scrollIntoView({ behavior: 'smooth' });
    }

    newBtn.addEventListener('click', (e) => {
        e.preventDefault();
        window.location.hash = '';
        window.location.reload();
    });
</script>

</body>
</html>
