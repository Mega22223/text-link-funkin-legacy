<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chart Linker</title>
    <style>
        /* Исходный дизайн для создания ссылки (серый, плоский) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: #0d1117; 
            color: #c9d1d9;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .wrapper {
            width: 100%;
            max-width: 650px;
            background-color: #161b22; 
            border: 1px solid #30363d; 
            padding: 25px;
            box-sizing: border-box;
        }
        .label-text { font-size: 14px; font-weight: 500; margin-bottom: 10px; color: #ffffff; display: block; }
        textarea {
            width: 100%; height: 280px; background-color: #0d1117; color: #e6edf3;
            border: 1px solid #30363d; padding: 12px; resize: none; box-sizing: border-box;
            font-family: monospace; font-size: 13px;
        }
        textarea:focus { outline: none; border-color: #58a6ff; }
        .btn {
            display: block; width: 100%; background-color: #21262d; color: #c9d1d9;
            border: 1px solid #30363d; padding: 12px; font-size: 13px; font-weight: 600;
            cursor: pointer; margin-top: 15px;
        }
        .btn:hover { background-color: #30363d; color: #f0f6fc; }
        .result-panel { display: none; margin-top: 25px; background-color: #0d1117; border: 1px solid #30363d; padding: 16px; }
        .result-title { font-size: 12px; font-weight: 600; color: #8b949e; margin-bottom: 8px; text-transform: uppercase; }
        .link-field { width: 100%; padding: 10px; background-color: #161b22; color: #58a6ff; border: 1px solid #30363d; font-family: monospace; font-size: 13px; box-sizing: border-box; cursor: pointer; }
        .info-text { font-size: 11px; color: #8b949e; margin-top: 8px; margin-bottom: 0; }

        /* Стиль для режима «ТУПО ТЕКСТ» (активируется скриптом) */
        body.raw-text-mode {
            background-color: #000000; /* Полностью черный экран */
            color: #ffffff; /* Полностью белый текст */
            display: block;
            padding: 20px;
            font-family: monospace;
            font-size: 14px;
            white-space: pre-wrap; /* Сохраняет все переносы строк и отступы */
            word-wrap: break-word;
        }
    </style>
</head>
<body>

<!-- Этот блок полностью сотрется и исчезнет, если в ссылке есть текст -->
<div class="wrapper" id="mainGui">
    <label class="label-text">Paste your chart data here:</label>
    <textarea id="textBox" placeholder="..."></textarea>
    <button class="btn" onclick="generateLink()">Generate Roblox Link</button>

    <div id="resultBox" class="result-panel">
        <div class="result-title">Generated Link</div>
        <input type="text" id="linkOutput" class="link-field" readonly onclick="this.select()">
        <p class="info-text">Click inside the field to auto-select, then press Ctrl+C to copy.</p>
    </div>
</div>

<script>
    // Проверяем, открыта ли ссылка с текстом
    window.addEventListener('DOMContentLoaded', () => {
        if (window.location.hash) {
            try {
                // Извлекаем и расшифровываем текст
                const base64 = window.location.hash.substring(1);
                const decodedText = decodeURIComponent(atob(base64));
                
                // Уничтожаем весь интерфейс (удаляем блок mainGui)
                document.getElementById('mainGui').remove();
                
                // Включаем режим чистого текста для страницы
                document.body.className = "raw-text-mode";
                
                // Выводим голый текст прямо на экран
                document.body.textContent = decodedText;
            } catch (e) {
                document.body.textContent = "Error: Invalid or broken link data.";
            }
        }
    });

    // Функция генерации ссылки (работает так же)
    function generateLink() {
        const textBox = document.getElementById('textBox');
        const resultBox = document.getElementById('resultBox');
        const linkOutput = document.getElementById('linkOutput');
        
        const text = textBox.value.trim();
        if (!text) {
            alert("Please paste your chart data first!");
            return;
        }

        const base64 = btoa(encodeURIComponent(text));
        const finalUrl = window.location.origin + window.location.pathname + '#' + base64;
        
        linkOutput.value = finalUrl;
        resultBox.style.display = 'block';
        resultBox.scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
